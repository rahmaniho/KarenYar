name: Build Admin Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/44dbcb8c-karenyar'
    paths:
      - 'admin-android/**'
      - '.github/workflows/admin-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: admin-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        id: verify
        run: |
          set -euo pipefail
          APK="admin-android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/admin-badging.txt
          grep -q "package: name='ir.karensoft.hesabyar.admin'" /tmp/admin-badging.txt
          grep -q "versionName='1.0.0'" /tmp/admin-badging.txt
          grep -q "sdkVersion:'24'" /tmp/admin-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/admin-badging.txt
          cp "$APK" hesabyar-admin-1.0.0-debug.apk
          sha256sum hesabyar-admin-1.0.0-debug.apk > hesabyar-admin-1.0.0-debug.apk.sha256
          echo "apk=hesabyar-admin-1.0.0-debug.apk" >> "$GITHUB_OUTPUT"
          echo "checksum=hesabyar-admin-1.0.0-debug.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-admin-android-debug
          path: |
            hesabyar-admin-1.0.0-debug.apk
            hesabyar-admin-1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="admin-apk-v1.0.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/admin-release-notes.md <<EOF
          # ادمین حساب‌یار — APK اندروید آزمایشی

          این فایل یک APK واقعی و قابل نصب برای پنل ادمین حساب‌یار است.

          - شناسه برنامه: \`ir.karensoft.hesabyar.admin\`
          - نسخه: \`1.0.0\`
          - حداقل اندروید: 7 (API 24)
          - هدف: \`https://staging.karen-soft.ir/admin/\`
          - امضا: Android Debug — فقط برای تست، مناسب بازار نیست.
          - برای ورود، نام کاربری و رمز Directory Privacy همان پوشه admin را وارد کن.
          - اطلاعات لایسنس به‌صورت آفلاین ذخیره نمی‌شود.

          ## نصب
          فایل APK را دانلود کن و روی گوشی اندروید باز کن. اگر لازم بود، اجازه نصب از همان منبع را فعال کن.

          Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$TAG" \
            hesabyar-admin-1.0.0-debug.apk \
            hesabyar-admin-1.0.0-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ادمین حساب‌یار اندروید 1.0.0 — آزمایشی" \
            --notes-file /tmp/admin-release-notes.md \
            --prerelease \
            --latest=false
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          echo "## Admin Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/admin-apk-v1.0.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/hesabyar-admin-1.0.0-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
