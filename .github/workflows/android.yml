name: Build Android APK

# اجرا: Actions → Build Android APK → Run workflow
# انتخاب دستی github-test یک APK آزمایشی عمومی می‌سازد؛ تگ‌های v* همیشه Release واقعی‌اند.
on:
  # تگ‌های نسخه فقط با کلید خصوصی Release ساخته و منتشر می‌شوند، نه با کلید Debug.
  push:
    # انتشار آزمایشی این جلسه فقط با کامیت صریح [android-test] فعال می‌شود.
    branches:
      - 'arena/da58321a-karenyar'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'github-test: انتشار آزمایشی در GitHub | test-apk: فقط فایل تست | signed-release: بازار با کلید خصوصی'
        type: choice
        options:
          - github-test
          - test-apk
          - signed-release
        default: github-test
      release:
        description: 'سازگاری قدیمی: Release با کلید خصوصی؛ برای APK آزمایشی خاموش بماند'
        type: boolean
        default: false

permissions:
  contents: write # برای ساخت Release و ضمیمه‌کردن خروجی امضاشده در بیلدهای تگی

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[android-test]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Select Android build target
        id: target
        env:
          ANDROID_BUILD_TYPE: ${{ inputs.build_type }}
          ANDROID_LEGACY_RELEASE: ${{ inputs.release }}
          ANDROID_TEST_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android-test]') }}
        run: node scripts/android-test-release.mjs target

      - name: Validate and decode release signing key
        if: steps.target.outputs.build_type == 'signed-release'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required signing secret is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure the four Android signing secrets before building a store release. No debug fallback is allowed."
            exit 1
          fi
          umask 077
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 به Node 22+ نیاز دارد
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # از SDK پیش‌فرض خود رانر استفاده می‌کنیم (پایدارتر از اکشن setup-android)
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Test Android publication guards
        run: npm run test:android-release

      - name: Build web app + sync into Android
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK (testing only)
        if: steps.target.outputs.build_type == 'github-test' || steps.target.outputs.build_type == 'test-apk'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK (not for stores)
        if: steps.target.outputs.build_type == 'github-test' || steps.target.outputs.build_type == 'test-apk'
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-android-debug-NOT-FOR-STORES
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified testing APK to GitHub prerelease
        if: steps.target.outputs.build_type == 'github-test'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_BUILD_TYPE: ${{ inputs.build_type }}
          ANDROID_LEGACY_RELEASE: ${{ inputs.release }}
          ANDROID_TEST_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[android-test]') }}
        run: >-
          npm run android:publish-test --
          android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build signed release (APK + AAB)
        if: steps.target.outputs.build_type == 'signed-release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release signature and non-debuggable APK
        if: steps.target.outputs.build_type == 'signed-release'
        run: >-
          npm run android:verify --
          android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0"

      - name: Upload signed release artifacts (for stores)
        if: steps.target.outputs.build_type == 'signed-release'
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish signed APK and AAB to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          name: حساب‌یار اندروید ${{ github.ref_name }}
          body: |
            نسخه‌ی انتشار امضاشده‌ی «حساب‌یار کارن سافت» — برای بارگذاری در بازار، app-release.apk را دریافت کنید.
            حداقل نسخه‌ی اندروید: ۷ (API 24) — کاملاً آفلاین.
          fail_on_unmatched_files: true

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
