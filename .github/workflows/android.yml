name: Build Android APK

# ساخت نسخه‌ی اندرویدی (Capacitor) — خروجی APK از بخش Artifacts همین اجرا قابل دانلود است.
# اجرا: تب Actions → Build Android APK → Run workflow
on:
  # با هر تگ نسخه (مثل v1.2.5) بیلد گرفته و APK به GitHub Release همان تگ ضمیمه می‌شود
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'بیلد انتشار امضاشده (AAB + APK) — نیازمند Secrets کلید امضا'
        type: boolean
        default: false

permissions:
  contents: write # برای ساخت Release و ضمیمه‌کردن APK در بیلدهای تگی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # از SDK پیش‌فرض خود رانر استفاده می‌کنیم (پایدارتر از اکشن setup-android)
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Build web app + sync into Android
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # انتشار عمومی قابل دانلود: در بیلد تگی، APK در Releases گیت‌هاب قرار می‌گیرد
      - name: Publish APK to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: حساب‌یار اندروید ${{ github.ref_name }}
          body: |
            نسخه‌ی اندرویدی «حساب‌یار کارن سافت» — فایل APK را دانلود و روی گوشی نصب کنید.
            حداقل نسخه‌ی اندروید: ۷ (API 24) — کاملاً آفلاین.
          fail_on_unmatched_files: true

      # انتشار امضاشده فقط وقتی ورودی release فعال است و Secrets ست شده‌اند:
      # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: Decode signing key (release only)
        if: inputs.release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ست نشده است — از بیلد انتشار صرف‌نظر شد."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release (AAB + APK)
        if: inputs.release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload release artifacts
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
