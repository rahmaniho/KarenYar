name: Deploy to GitHub Pages

# نمایش زنده‌ی برنامه روی https://rahmaniho.github.io/KarenYar/
on:
  push:
    branches: [main, 'arena/7c7cf0f8-karenyar']
  # روزی دو بار نرخ‌های ارز/طلا/نقره تازه می‌شوند و سایت دوباره منتشر می‌شود (۱۰:۰۰ و ۱۷:۰۰ تهران)
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # نرخ‌های روز ارز/طلا/نقره/سکه را در بیلد تازه می‌کند؛ اگر منبع نرخ در دسترس نبود،
      # با همان نرخ‌های داخل مخزن ادامه می‌دهیم تا انتشار متوقف نشود.
      - name: Update live rates (currency, gold, silver)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/update-rates.mjs

      - name: Build for GitHub Pages subpath
        env:
          VITE_BASE: /KarenYar/
        run: npm run build

      # ترفند SPA روی GitHub Pages: مسیرهای ناشناخته index.html را می‌گیرند
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # اگر Pages هنوز از تنظیمات ریپو فعال نشده باشد، خودِ ورک‌فلو فعالش می‌کند
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
