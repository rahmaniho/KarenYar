name: Deploy to GitHub Pages

# نمایش زنده‌ی برنامه روی زیردامنه‌ی اختصاصی: https://karo.karen-soft.ir
# دامنه از فایل public/CNAME خوانده می‌شود و باید در پنل DNS به rahmaniho.github.io اشاره کند
# (راهنمای کامل اتصال: docs/domain-setup.md)
on:
  push:
    # فقط main؛ محیط github-pages هم تنها همین شاخه را می‌پذیرد.
    branches: [main]
  # روزی دو بار نرخ‌های ارز/طلا/نقره تازه می‌شوند و سایت دوباره منتشر می‌شود (۱۰:۰۰ و ۱۷:۰۰ تهران)
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # نرخ‌های روز ارز/طلا/نقره/سکه را در بیلد تازه می‌کند؛ اگر منبع نرخ در دسترس نبود،
      # با همان نرخ‌های داخل مخزن ادامه می‌دهیم تا انتشار متوقف نشود.
      - name: Update live rates (currency, gold, silver)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/update-rates.mjs

      - name: Build for custom subdomain (site root)
        env:
          VITE_BASE: /
        run: npm run build

      # ترفند SPA روی GitHub Pages: مسیرهای ناشناخته index.html را می‌گیرند
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # اگر Pages هنوز از تنظیمات ریپو فعال نشده باشد، خودِ ورک‌فلو فعالش می‌کند
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # بررسی اتصال دامنه پس از انتشار: اگر DNS هنوز به GitHub Pages اشاره نکند،
      # فقط یک هشدار ثبت می‌شود و انتشار شکست نمی‌خورد.
      - name: Connection check — https://karo.karen-soft.ir
        continue-on-error: true
        run: |
          set -uo pipefail
          status=$(curl -sS -L --max-time 30 -o /tmp/karo-index.html -w '%{http_code}' https://karo.karen-soft.ir/ || echo '000')
          echo "GET https://karo.karen-soft.ir/ -> ${status}"
          if [ "${status}" = "200" ] && grep -q '<div id="root">' /tmp/karo-index.html; then
            echo "OK — دامنه، اپ کارو را سرو می‌کند."
          else
            echo "::warning::دامنهٔ karo.karen-soft.ir هنوز اپ کارو را سرو نمی‌کند (کد ${status}). رکورد CNAME در پنل DNS باید به rahmaniho.github.io اشاره کند — docs/domain-setup.md"
          fi
