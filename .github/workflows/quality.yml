name: Quality checks

on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, pdo_mysql, openssl, zip
          coverage: none
          tools: none

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:license-build
      - run: npm run test:license-backend
      - run: npm run test:staging-app-deploy
      - run: npm run build
        env:
          VITE_BASE: /
      - run: npm run build:staging-web

      # Dependency upgrades are a separate tracked stage. Publish the audit
      # result now so advisories cannot disappear from review unnoticed.
      - name: Production dependency audit report
        if: always()
        run: npm audit --omit=dev --json > npm-audit-production.json
        continue-on-error: true

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-production
          path: npm-audit-production.json
          if-no-files-found: ignore
          retention-days: 30

  license-transactions:
    name: License transactions (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: MySQL 8.0
            image: mysql:8.0
          - engine: MariaDB 10.11
            image: mariadb:10.11
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, pdo_mysql
          coverage: none
          tools: none
      - name: Refresh locking/freshness/clocks, cleanup handoff, replay and rollback
        run: php scripts/test-license-refresh-transactions.php
        env:
          KAREN_LICENSE_DB_TESTS: '1'
          KAREN_LICENSE_TEST_PORT: ${{ job.services.database.ports[3306] }}
          KAREN_LICENSE_TEST_PASSWORD: isolated-ci-only
